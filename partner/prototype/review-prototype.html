<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EarthLabs EPDMS – Clickable Review Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
:root{--teal:#13595a;--turq:#239a9e;--cream:#fffcf2;--slate:#314452;--gold:#c89739;--brown:#7b543b;--olive:#5d643f;--mint:#ebf3d8;--sky:#ccecfc;--peach:#fcd3c5;--sand:#ffdba7;
--line:rgba(19,89,90,.2);--mute:#51626f;--soft:#f3f7ee;--good:#2f7d52;--warn:#b07d17;--serious:#c0622a;--crit:#b3372f;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--slate);font-family:'Open Sans',system-ui,sans-serif;font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:30px;color:var(--teal);line-height:1.15}
h2{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:22px;color:var(--teal);line-height:1.2}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:700}
a{color:var(--teal)}
.demo-bar{background:var(--slate);color:var(--cream);font-size:12.5px;padding:5px 16px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center}
.demo-bar b{color:var(--sand)}
.top{position:sticky;top:0;z-index:40;background:rgba(255,252,242,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
.brand{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:22px;color:var(--teal);line-height:1;cursor:pointer}
.brand small{display:block;font-family:'Open Sans',sans-serif;font-size:10px;letter-spacing:.16em;color:var(--turq);font-weight:700;margin-top:3px}
.seg{display:flex;border:1.5px solid var(--teal);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--teal);font-weight:700;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1.5px solid var(--teal)}
.seg button[aria-pressed=true]{background:var(--teal);color:var(--cream)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.who select{border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff}
.av{width:30px;height:30px;border-radius:50%;background:var(--teal);color:var(--cream);display:grid;place-items:center;font-weight:700;font-size:13px}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 100px)}
.side{border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow:auto;background:#fffdf6}
.side .grp{font-size:10.5px;letter-spacing:.14em;color:var(--mute);font-weight:700;margin:14px 8px 4px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--slate);font-size:14px}
.nav:hover{background:#e8f1ea}
.nav[aria-current=page]{background:var(--teal);color:var(--cream)}
.nav .ic{width:18px;text-align:center;opacity:.85}
.nav .ct{margin-left:auto;background:var(--gold);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 7px}
.main{padding:20px 26px 60px;min-width:0;max-width:1500px}
.sub{color:var(--mute);margin:4px 0 16px;max-width:900px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.card.flat{background:var(--soft)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.kpi{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
.kpi .v{font-family:'Playfair Display',serif;font-weight:900;font-size:26px;color:var(--teal);line-height:1.2}
.kpi .d{font-size:12.5px;color:var(--mute)}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--teal)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.btn{border:1.5px solid var(--teal);background:#fff;color:var(--teal);border-radius:9px;padding:6px 13px;cursor:pointer;font-weight:700;font-size:13.5px}
.btn:hover{background:#eaf4ee}
.btn.pri{background:var(--teal);color:var(--cream)}.btn.pri:hover{background:#0f4a4b}
.btn.gold{border-color:#9a7421;color:#8a6619}.btn.gold:hover{background:#fbf1da}
.btn.red{border-color:var(--crit);color:var(--crit)}.btn.red:hover{background:#fbeceb}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed=true]{background:var(--teal);color:var(--cream)}
.lk{background:none;border:0;padding:0;color:var(--teal);font-weight:600;text-decoration:underline;text-decoration-color:rgba(19,89,90,.35);text-underline-offset:3px;cursor:pointer;font-size:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fbfdf8;position:sticky;top:0}
table.t td{padding:8px 10px;border-bottom:1px solid rgba(19,89,90,.1);vertical-align:middle}
table.t tr.cl{cursor:pointer}table.t tr.cl:hover td{background:#f1f7f0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1.5px solid var(--line);border-radius:12px;background:#fff;max-height:620px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;background:#e8eef0;color:var(--slate)}
.b-good{background:#dff0e5;color:#1f6a3f}.b-warn{background:#fbf0d3;color:#8a6212}.b-ser{background:#fbe5d6;color:#a4501b}.b-crit{background:#f8dcd9;color:#a02a23}.b-info{background:#d9eef0;color:#0f4f51}.b-mute{background:#ececec;color:#555}.b-gold{background:#f6e6c0;color:#7a5a10}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;border-radius:6px;padding:1px 7px;color:#fff;background:var(--teal)}
.bar{height:9px;border-radius:5px;background:#e3ebe3;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:5px}
.bar.g>i{background:var(--good)}.bar.w>i{background:var(--gold)}.bar.r>i{background:var(--crit)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:10px 0 14px}
.tabs button{border:0;background:transparent;padding:8px 14px;font-weight:700;color:var(--teal);cursor:pointer;border-radius:9px 9px 0 0;font-size:14px}
.tabs button[aria-selected=true]{background:var(--teal);color:var(--cream)}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.field label{font-size:11.5px;letter-spacing:.06em;font-weight:700;color:var(--teal);text-transform:uppercase}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--turq);border-color:var(--turq)}
.field small{color:var(--mute);font-size:12px}
.frm2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.note{border-left:4px solid var(--gold);background:#fbf4e0;padding:9px 12px;border-radius:0 9px 9px 0;font-size:13.5px;margin:10px 0}
.note.bad{border-color:var(--crit);background:#fbeceb}.note.ok{border-color:var(--good);background:#e6f3ea}.note.ai{border-color:var(--turq);background:#e3f3f4}
.mod-bg{position:fixed;inset:0;background:rgba(19,40,45,.5);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}
.modal{background:#fff;border-radius:16px;max-width:720px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:960px}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .body{padding:16px 20px;max-height:68vh;overflow:auto}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;cursor:pointer;margin-left:auto;color:var(--mute)}
.drawer-bg{position:fixed;inset:0;background:rgba(19,40,45,.35);z-index:60}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(620px,100%);background:#fff;z-index:61;box-shadow:-12px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer .body{padding:16px 20px;overflow:auto;flex:1}
.drawer footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--slate);color:var(--cream);padding:10px 18px;border-radius:12px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;font-weight:600}
.steps{display:flex;gap:0;flex-wrap:wrap;margin:6px 0}
.step{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);padding:3px 10px 3px 0}
.step i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:#fff}
.step.done{color:var(--teal)}.step.done i{background:var(--teal);border-color:var(--teal);color:#fff}
.step.cur{color:var(--slate);font-weight:700}.step.cur i{border-color:var(--gold);background:var(--sand);color:var(--slate)}
.tl{border-left:3px solid var(--line);margin-left:6px;padding-left:14px}
.tl>div{position:relative;padding:0 0 12px}
.tl>div:before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--teal);border:2px solid #fff}
.tl small{color:var(--mute)}
.lock{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--mute)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px}
.hero{background:linear-gradient(135deg,var(--teal),#0e4445);color:var(--cream);border-radius:18px;padding:26px 28px}
.hero h1{color:var(--cream)}
.hero p{max-width:760px;margin:8px 0 0;color:#dfeee9}
.pubwrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.mapwrap{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
svg.gm{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.tip{position:fixed;pointer-events:none;background:var(--slate);color:var(--cream);font-size:13px;padding:5px 9px;border-radius:8px;z-index:120;display:none;max-width:260px}
.cert{border:6px double var(--teal);background:#fffdf7;padding:28px;text-align:center;border-radius:6px;position:relative}
.cert h1{font-size:30px}
.cert .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;text-align:left;margin:18px auto;max-width:560px}
.cert .row2 b{display:block;font-size:10.5px;letter-spacing:.12em;color:var(--turq);text-transform:uppercase}
.doc{background:#fff;border:1.5px solid var(--line);padding:26px 32px;font-family:Georgia,serif;font-size:14px;line-height:1.6}
.doc h4{font-family:'Open Sans',sans-serif;margin:14px 0 4px;color:var(--teal)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(19,89,90,.1)}
.pill-row button{margin:0 6px 6px 0}
.mini{font-size:12.5px;color:var(--mute)}
.mob{display:none}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:none}.side.open{display:block}.mob{display:inline-flex}.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:1fr}.main{padding:16px 14px 60px}.frm2{grid-template-columns:1fr}}
@media(max-width:560px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}h1{font-size:25px}}

/* ===== premium layer ===== */
:root{--sh1:0 1px 2px rgba(19,52,56,.06),0 4px 14px rgba(19,52,56,.06);--sh2:0 2px 4px rgba(19,52,56,.06),0 14px 34px rgba(19,52,56,.12);--ln:rgba(19,89,90,.13);--goldg:linear-gradient(135deg,#d9ae55,#b8872b)}
body{background:radial-gradient(1200px 500px at 85% -120px,rgba(35,154,158,.10),transparent 70%),var(--cream);-webkit-font-smoothing:antialiased;letter-spacing:.005em}
h1{letter-spacing:-.01em}h2{letter-spacing:-.005em}
h3{letter-spacing:.16em;font-size:11px}
.demo-bar{background:linear-gradient(90deg,#26343f,#314452 50%,#26343f);font-size:11.5px;letter-spacing:.02em;padding:4px 16px}
.top{background:rgba(255,252,242,.82);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--ln);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 6px 24px rgba(19,52,56,.05);padding:9px 22px}
.brand{font-size:23px;letter-spacing:-.01em}
.brand small{letter-spacing:.24em;font-size:9.5px}
.seg{border:1px solid var(--ln);background:rgba(255,255,255,.7);border-radius:999px;padding:3px;gap:2px;box-shadow:var(--sh1)}
.seg button{border:0!important;border-radius:999px;padding:6px 15px;background:transparent;transition:all .2s;font-size:12.5px;letter-spacing:.02em}
.seg button:hover{background:rgba(19,89,90,.07)}
.seg button[aria-pressed=true]{background:linear-gradient(135deg,#176a6b,#0f4a4b);color:var(--cream);box-shadow:0 4px 12px rgba(19,89,90,.32)}
.av{background:linear-gradient(135deg,#1c7577,#0f4a4b);box-shadow:0 0 0 3px rgba(200,151,57,.35)}
.who select{border-radius:999px;border-color:var(--ln);padding:5px 12px;background:rgba(255,255,255,.8)}
.side{background:linear-gradient(180deg,#fffdf6,#f8f6ea);border-right:1px solid var(--ln);padding:16px 12px}
.side .grp{letter-spacing:.2em;font-size:9.5px;margin:20px 10px 6px;color:#7b8a93}
.nav{border-radius:10px;padding:8px 11px;font-weight:600;font-size:13.5px;transition:background .18s,transform .18s,box-shadow .18s;position:relative}
.nav:hover{background:rgba(19,89,90,.07);transform:translateX(2px)}
.nav[aria-current=page]{background:linear-gradient(135deg,#176a6b,#0f4a4b);box-shadow:0 6px 16px rgba(19,89,90,.28)}
.nav[aria-current=page]:before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--gold)}
.nav .ct{background:var(--goldg);box-shadow:0 2px 6px rgba(184,135,43,.4)}
.main{padding:28px 34px 70px;animation:fadeup .45s cubic-bezier(.2,.7,.2,1)}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1:after{content:"";display:block;width:44px;height:3px;border-radius:3px;background:var(--goldg);margin-top:10px}
.cert h1:after,.hero h1:after,.hero2 h1:after,.pubwrap h1:after{display:none}
.sub{font-size:14.5px;color:#5a6b77;margin:10px 0 22px;line-height:1.6}
.card,.kpi{border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh1);transition:box-shadow .25s,transform .25s,border-color .25s}
.card{padding:20px 22px}
.card:hover{box-shadow:var(--sh2)}
.kpi{padding:16px 18px;position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,#fbfcf7)}
.kpi:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--turq))}
.kpi .l{letter-spacing:.14em;font-size:10px}
.kpi .v{font-size:28px;margin:3px 0 1px}
.kpi.click:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:rgba(35,154,158,.5)}
.btn{border:1px solid rgba(19,89,90,.45);border-radius:10px;padding:7px 15px;transition:all .18s;box-shadow:0 1px 2px rgba(19,52,56,.05);letter-spacing:.01em}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(19,52,56,.12)}
.btn:active{transform:none}
.btn.pri{background:linear-gradient(135deg,#176a6b,#0f4a4b);border-color:#0f4a4b;box-shadow:0 4px 14px rgba(19,89,90,.3)}
.btn.pri:hover{background:linear-gradient(135deg,#1b7a7c,#125456)}
.btn.sm{border-radius:8px}
.btn.gold-fill{background:var(--goldg);color:#2b2008;border:0;padding:11px 22px;font-size:14.5px;box-shadow:0 8px 22px rgba(200,151,57,.4)}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.45);padding:11px 20px;font-size:14.5px;backdrop-filter:blur(4px)}
.btn.ghost:hover{background:rgba(255,255,255,.18)}
table.t th{background:#f7faf3;font-size:10.5px;letter-spacing:.14em;border-bottom:1px solid var(--ln);padding:11px 12px}
table.t td{padding:11px 12px;border-bottom:1px solid rgba(19,89,90,.07)}
table.t tr.cl:hover td{background:#f2f8f3}
.tw{border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh1)}
.badge{padding:3px 11px;font-size:11px;letter-spacing:.02em}
.bar{height:7px;background:#e8eee6}.bar>i{background:linear-gradient(90deg,var(--teal),var(--turq))}
.tabs{border-bottom:1px solid var(--ln);gap:2px}
.tabs button{border-radius:10px 10px 0 0;font-size:13.5px;position:relative;transition:background .15s}
.tabs button:hover{background:rgba(19,89,90,.06)}
.tabs button[aria-selected=true]{background:transparent;color:var(--teal)}
.tabs button[aria-selected=true]:after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--goldg)}
.field input,.field select,.field textarea{border:1px solid rgba(19,89,90,.25);border-radius:10px;padding:9px 12px;transition:box-shadow .15s,border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--turq);box-shadow:0 0 0 4px rgba(35,154,158,.15)}
.field label{letter-spacing:.12em;font-size:10.5px}
.note{border-radius:12px;border:1px solid rgba(200,151,57,.25);border-left:4px solid var(--gold);padding:11px 15px}
.note.ok{border-color:rgba(47,125,82,.25);border-left-color:var(--good)}.note.bad{border-color:rgba(179,55,47,.25);border-left-color:var(--crit)}.note.ai{border-color:rgba(35,154,158,.25);border-left-color:var(--turq)}
.mod-bg{background:rgba(14,34,38,.55);backdrop-filter:blur(5px);animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{border-radius:20px;box-shadow:0 30px 80px rgba(8,30,34,.4);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal header,.drawer header{background:linear-gradient(180deg,#fbfcf6,#fff)}
.drawer{box-shadow:-20px 0 60px rgba(8,30,34,.25);animation:slidein .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.toast{background:linear-gradient(135deg,#26343f,#314452);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:11px 22px}
.step i{border-width:1.5px}
.step.done i{background:linear-gradient(135deg,#176a6b,#0f4a4b)}
.step.cur i{background:var(--goldg);border-color:#b8872b;color:#2b2008}
.mapwrap{border-radius:18px;box-shadow:var(--sh1);border:1px solid var(--ln);background:linear-gradient(180deg,#fff,#f8faf4)}
.cert{border:1px solid #c89739;outline:1px solid #c89739;outline-offset:-10px;box-shadow:var(--sh2);background:linear-gradient(180deg,#fffdf7,#fbf6e6)}
.doc{border-radius:12px;border:1px solid var(--ln)}
/* switch */
.switch{position:relative;display:inline-block;width:44px;height:25px;flex:0 0 44px}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2}
.switch i{position:absolute;inset:0;background:#cfd8d6;border-radius:999px;transition:.2s}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+i{background:linear-gradient(135deg,#1c7577,#0f4a4b)}
.switch input:checked+i:after{transform:translateX(19px)}
.switch input:focus-visible+i{outline:3px solid var(--gold);outline-offset:2px}
/* public site */
.hero2{position:relative;overflow:hidden;border-radius:26px;padding:58px 52px 40px;color:var(--cream);background:radial-gradient(700px 360px at 90% 0,rgba(35,154,158,.55),transparent 65%),radial-gradient(500px 300px at 0 110%,rgba(200,151,57,.28),transparent 60%),linear-gradient(135deg,#13595a,#0b3a3b);box-shadow:0 30px 70px rgba(11,58,59,.35)}
.hero2:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(90deg,transparent,#000 70%)}
.hero2>*{position:relative}
.hero2 h1{color:#fffcf2;font-size:46px;line-height:1.08;max-width:700px}
.hero2 p{max-width:600px;color:#cfe6e1;font-size:16px;line-height:1.7;margin:16px 0 0}
.eyebrow{font-size:11px;letter-spacing:.26em;font-weight:700;color:#e7c982;margin-bottom:14px}.eyebrow.dk{color:var(--turq);margin-bottom:6px}
.hero-stats{display:flex;gap:38px;margin-top:38px;padding-top:22px;border-top:1px solid rgba(255,255,255,.16);flex-wrap:wrap}
.hero-stats b{font-family:'Playfair Display',serif;font-size:30px;display:block;color:#fff;line-height:1}
.hero-stats span{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#a9cfc9}
.sec-h{margin:46px 0 18px;text-align:center}
.paths{max-width:880px;margin:0 auto}
.path{position:relative;background:#fff;border:1px solid var(--ln);border-radius:22px;padding:30px 28px 26px;box-shadow:var(--sh1);transition:transform .3s,box-shadow .3s;overflow:hidden}
.path:hover{transform:translateY(-6px);box-shadow:0 22px 50px rgba(19,52,56,.18)}
.path:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--teal),var(--turq),var(--gold))}
.path{display:flex;flex-direction:column}.path .btn.pri{margin-top:auto;align-self:flex-start}
.path-n{position:absolute;right:22px;top:14px;font-family:'Playfair Display',serif;font-size:54px;color:rgba(19,89,90,.07);line-height:1}
.path-ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,#e6f2ee,#f6ecd2);margin-bottom:14px}
.path h2{font-size:25px;margin-bottom:6px}
.pts{list-style:none;padding:0;margin:14px 0 20px}
.pts li{padding:6px 0 6px 26px;position:relative;font-size:13.5px;border-bottom:1px dashed rgba(19,89,90,.12)}
.pts li:before{content:"✓";position:absolute;left:0;top:6px;width:17px;height:17px;border-radius:50%;background:var(--teal);color:#fff;font-size:10px;display:grid;place-items:center}
.journey{margin:48px auto 0;max-width:900px;text-align:center}
.jrow{display:flex;align-items:flex-start;justify-content:center;margin-top:14px}
.jst{display:flex;flex-direction:column;align-items:center;gap:8px;flex:0 0 120px;font-size:12.5px;font-weight:600}
.jst i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;background:linear-gradient(135deg,#176a6b,#0f4a4b);box-shadow:0 6px 16px rgba(19,89,90,.3)}
.jline{flex:1;height:2px;margin-top:20px;background:repeating-linear-gradient(90deg,rgba(19,89,90,.35) 0 6px,transparent 6px 12px)}
.pubwrap{max-width:1120px}
@media(max-width:700px){.hero2{padding:36px 22px 26px}.hero2 h1{font-size:32px}.jrow{flex-wrap:wrap;gap:10px}.jline{display:none}.jst{flex:0 0 30%}.main{padding:20px 16px 60px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function promoDecision(p){const k=nextKey(p);if(!k||!p.crit||p.status!=='Active')return null;const e=evalCrit(k,p.crit);const c=CR[k];let d,cls;if(e.weighted==null){d='Not enough data';cls='b-mute'}else if(e.weighted>=c.promote&&e.gates&&p.qtrs>=c.q){d='Eligible for assessment';cls='b-good'}else if(e.weighted>=c.promote&&e.gates){d='Hold – needs '+(c.q-p.qtrs)+' more quarter(s) at the promote score';cls='b-info'}else if(e.weighted>=c.hold){d='Hold and develop';cls='b-warn'}else{d='Corrective plan';cls='b-crit'}return{k,e,d,cls,c}}

 const di=distInfo(a.district);
 if(['DLR','DST','STK'].includes(a.type)){const yrs=+an.years||0;const fit=Math.min(1,yrs/10)*.7+(/soap|clean|fmcg|personal|home|hygiene/i.test(an.products||'')?.3:0);const team=an.team==='Yes'||an.warehouse==='Yes'||a.type==='STK'?.8:.3;const act=[+an.outlets||0,+an.wc||0,a.rep,Math.round(fit*100)/100,team];joinEval=evalCrit('0→1',act);suit=joinEval.weighted;if(!a.reg){risks.push(['crit','Company registration could not be verified – this is a must-pass condition'])}if(!a.gst)checks.push('No GST number – allowed for small dealers, not a blocker');if(a.rep==null)checks.push('Market reputation not verified yet – needs 2 trade references from the field team');if(+an.wc<1.2)risks.push(['warn','Working capital is only '+an.wc+'x the opening order'])}
 if(miss.length)risks.push(['warn','Missing documents: '+miss.join(', ')]);
 if(a.excl)risks.push(['warn','Asks for exclusive rights. Policy: every partner starts non-exclusive; exclusivity is earned.']);
 if(di.excl&&['DLR','DST'].includes(a.type))risks.push(['crit','Territory conflict: '+di.excl.name+' ('+di.excl.id+') holds exclusive rights in '+a.district]);
 if(a.type==='DST'||a.type==='STK'){const ex=DB.partners.find(p=>p.cat==='DST'&&p.district===a.district&&p.status==='Active');if(ex&&a.type==='DST')risks.push(['warn','Plan is one distributor per district; '+ex.name+' already serves '+a.district]);if(ex&&a.type==='STK')checks.push('Existing distributor in '+a.district+' ('+ex.name+') would be supplied by this stockist – check conflicts')}
 const peers=DB.apps.filter(x=>x.id!==a.id&&x.district===a.district&&!['Rejected'].includes(x.status));if(peers.length)risks.push(['warn','Overlapping applicant in '+a.district+': '+peers.map(p=>p.name).join(', ')]);
 if(a.type==='DST'){if(+an.outlets>=150&&+an.wc>=2&&+an.dealers>=10)rec='Authorized Distributor (network supports it)';else{rec='Start as Authorized Dealer';checks.push('Network of '+an.outlets+' outlets / '+an.dealers+' dealers is below the distributor profile – start as Dealer and earn the step up')}}
 if(a.type==='STK'){rec='Appoint as Authorized Distributor first; assess for Circle Stockist after four strong quarters';checks.push('Policy: every channel partner starts at Dealer unless management approves another category')}

 const crit=risks.some(r=>r[0]==='crit');const lines=[`${a.name} (${esc(a.person)}) applies as ${CATS[a.type].s} in ${a.district}. Application is ${comp}% complete${miss.length?' ('+miss.length+' document(s) missing)':''}.`];
 if(suit!=null)lines.push(`Joining score on verified items: ${(suit*100).toFixed(0)} / 100 (promote at ${CR['0→1'].promote*100}).`);

const PAL=['#13595a','#c89739','#314452','#239a9e','#7b543b'];
function legend(items){return `<div class="legend">${items.map((n,i)=>`<span><i style="background:${PAL[i]}"></i>${esc(n)}</span>`).join('')}</div>`}
function barChart(labels,series,o={}){const W=560,H=o.h||220,m={l:42,r:10,t:10,b:28};const iw=W-m.l-m.r,ih=H-m.t-m.b;const max=o.max||Math.ceil(Math.max(...series.flatMap(s=>s.v))*1.15);const gw=iw/labels.length;const bw=Math.min(22,(gw-10)/series.length);
 let g='';for(let i=0;i<=4;i++){const y=m.t+ih-ih*i/4;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="#e3e9e3"/><text x="${m.l-6}" y="${y+4}" font-size="11" fill="#51626f" text-anchor="end">${Math.round(max*i/4*10)/10}</text>`}
 labels.forEach((l,i)=>{const x0=m.l+gw*i+(gw-bw*series.length-2*(series.length-1))/2;series.forEach((s,j)=>{const h=ih*s.v[i]/max;const x=x0+j*(bw+2);g+=`<path d="M${x},${m.t+ih} V${m.t+ih-h+4} Q${x},${m.t+ih-h} ${x+4},${m.t+ih-h} H${x+bw-4} Q${x+bw},${m.t+ih-h} ${x+bw},${m.t+ih-h+4} V${m.t+ih}Z" fill="${PAL[j]}"><title>${esc(s.n)} · ${esc(l)}: ${s.v[i]}${o.unit||''}</title></path>`});g+=`<text x="${m.l+gw*i+gw/2}" y="${H-8}" font-size="11.5" fill="#51626f" text-anchor="middle">${esc(l)}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label||'Bar chart')}">${g}</svg>${series.length>1?legend(series.map(s=>s.n)):''}`}
function lineChart(labels,series,o={}){const W=560,H=o.h||200,m={l:42,r:14,t:10,b:28};const iw=W-m.l-m.r,ih=H-m.t-m.b;const all=series.flatMap(s=>s.v.filter(x=>x!=null));const min=o.min!=null?o.min:Math.floor(Math.min(...all)/10)*10,max=o.max!=null?o.max:Math.ceil(Math.max(...all)/10)*10;const X=i=>m.l+iw*i/(labels.length-1||1),Y=v=>m.t+ih-ih*(v-min)/(max-min||1);let g='';for(let i=0;i<=4;i++){const v=min+(max-min)*i/4,y=Y(v);g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="#e3e9e3"/><text x="${m.l-6}" y="${y+4}" font-size="11" fill="#51626f" text-anchor="end">${Math.round(v)}</text>`}
 if(o.bands)o.bands.forEach(b=>{g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(b[0])}" y2="${Y(b[0])}" stroke="#c89739" stroke-dasharray="4 4"/><text x="${W-m.r}" y="${Y(b[0])-3}" font-size="10.5" fill="#8a6619" text-anchor="end">${b[1]}</text>`});
 labels.forEach((l,i)=>g+=`<text x="${X(i)}" y="${H-8}" font-size="11.5" fill="#51626f" text-anchor="middle">${esc(l)}</text>`);
 series.forEach((s,j)=>{let d='';s.v.forEach((v,i)=>{if(v!=null)d+=(d?'L':'M')+X(i)+','+Y(v)});g+=`<path d="${d}" fill="none" stroke="${PAL[j]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;s.v.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="${PAL[j]}" stroke="#fff" stroke-width="2"><title>${esc(s.n)} · ${esc(labels[i])}: ${v}${o.unit||''}</title></circle>`})});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label||'Line chart')}">${g}</svg>${series.length>1?legend(series.map(s=>s.n)):''}`}
function tgtRow(name,t,a,fmt){const p=t?a/t*100:0;return `<tr><td>${name}</td><td class="n">${fmt(t)}</td><td class="n">${fmt(a)}</td><td class="n" style="width:36%"><div class="row" style="flex-wrap:nowrap"><div style="flex:1">${bar(p,p>=100?'g':p>=75?'':'w')}</div><b style="min-width:42px;text-align:right">${Math.round(p)}%</b></div></td></tr>`}

function qr(seed){let h=0;for(const c of seed)h=(h*131+c.charCodeAt(0))%1000003;let s='';const n=21;for(let y=0;y<n;y++)for(let x=0;x<n;x++){const f=(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);let on;if(f){const lx=x%(n-7<x?n-7:7)>=0?x:x;const ix=x<7?x:x-(n-7),iy=y<7?y:y-(n-7);on=ix===0||ix===6||iy===0||iy===6||(ix>=2&&ix<=4&&iy>=2&&iy<=4)}else{h=(h*1103515245+12345)%2147483647;on=(h>>8)%2===0}if(on)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="-1 -1 23 23" width="92" height="92" style="background:#fff"><g fill="#13595a">${s}</g></svg>`}

const slabOf=p=>p.cat==='INS'?null:(SLAB[p.cat]||SLAB.DLR);
function unitPrice(p,s){const exg=s.mrp/(1+GST);const sl=slabOf(p);return sl?exg*(1-sl[s.slab]):exg*0.9}
function tierPrices(s){const exg=s.mrp/(1+GST);return{base:exg,DLR:exg*(1-SLAB.DLR[s.slab]),DST:exg*(1-SLAB.DST[s.slab]),STK:exg*(1-SLAB.STK[s.slab]),MST:exg*(1-SLAB.MST[s.slab]),SST:exg*(1-SLAB.SST[s.slab]),INS:exg*.9}}
const gstSplit=(p,x)=>(p&&p.state&&p.state!=='Gujarat')?{igst:x*GST,cgst:0,sgst:0}:{igst:0,cgst:x*GST/2,sgst:x*GST/2};
function priceLines(p,items,first){let taxable=0,disc=0;const lines=items.map(([k,c])=>{const s=sku(k);const units=c*s.pack;const unit=unitPrice(p,s);const amt=units*unit;taxable+=amt;return{sku:k,s,cartons:c,units,unit,amt}});
 const bc=lines.filter(l=>l.s.slab===1&&!/Sachet/.test(l.s.cat)).reduce((a,l)=>a+l.cartons,0);const applied=[];if(schLive(SCHEMES[1])&&bc>=SCHEMES[1].minCartons){const d=lines.filter(l=>l.s.slab===1&&l.s.cat!=='5-litre institutional').reduce((a,l)=>a+l.amt,0)*SCHEMES[1].pct;disc+=d;applied.push(SCHEMES[1].n+' (−'+inr(d)+')')}
 if(first&&schLive(SCHEMES[0])&&taxable*(1+GST)>=SCHEMES[0].min)applied.push(SCHEMES[0].n+' (free kit)');
 const net=taxable-disc;const g=gstSplit(p,net);return{lines,taxable,disc,net,gst:net*GST,cgst:g.cgst,sgst:g.sgst,igst:g.igst,total:net*(1+GST),applied}}
function orderTotal(o){return priceLines(partner(o.pid),o.items,false)}

const IMPROVE={'Sales target achievement':'Agree a catch-up plan for the monthly target and review stock levels with the partner.','Retail / dealer network development':'Add outlets with a joint field day each fortnight; target 10 new outlets next month.','Payment discipline':'Move to shorter credit terms until dues are cleared; send reminders 3 days before due dates.','Secondary sales':'Start monthly sales-to-outlet reporting and schedule a field verification visit.','New customer acquisition':'Run a sampling drive in the district’s industrial areas.','Repeat orders and retention':'Call outlets that have not reordered in 30 days.','Inventory and operational discipline':'Introduce a weekly stock count and order on a fixed cycle.','Brand and policy compliance':'Field audit of price list, MRP and brand display; refresher on brand guidelines.'};
function monthsSince(p){return Math.max(1,Math.ceil(daysBetween(p.since,TODAY)/30))}
function perfView(p,o={}){const s=score(p);const b=bandOf(s.score);const prev=p.hist.length?p.hist[p.hist.length-1]:null;const d=s.score!=null&&prev!=null?Math.round((s.score-prev)*10)/10:null;const tr=trend(p);const al=alerts(p);
 if(p.status==='Agreement Pending')return '<div class="note">No performance profile yet. It starts once the partner is active and has orders.</div>';
 const ver=s.parts.filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);const strong=ver.slice(0,2),weak=ver.slice(-2).reverse();
 const mo=monthsSince(p),qm=Math.min(mo,3),ym=Math.min(mo,12);const pa=prev&&s.score?p.tgt.sales[1]*prev/s.score:p.tgt.sales[1];const g=(p.tgt.sales[1]/pa-1)*100;
 const rows=[['Monthly sales (₹ lakh)',p.tgt.sales,v=>v.toFixed(1)],['Active outlets',p.tgt.outlets,v=>v],['New outlets',p.tgt.newOut,v=>v],['Collections (₹ lakh)',p.tgt.coll,v=>v.toFixed(1)]].filter(r=>r[1][0]>0);
 const pr=o.portal?null:promoDecision(p);
 return `<div class="grid g4">${kpi('Score this month',s.score==null?'—':s.score,s.score==null?'No verified data yet':`<span class="badge ${b[1]}">${b[0]}</span>`)}${kpi('Previous month',prev==null?'—':prev,d==null?'':(d>=0?'▲ ':'▼ ')+Math.abs(d)+' points')}${kpi('Direction',`<span style="font-size:19px">${tr}</span>`,'based on last 6 months')}${kpi('Verified weight',s.vw+' / 100',s.un.length?s.un.length+' parameter(s) unverified':'all verified')}</div>
 ${al.map(a=>`<div class="note ${a[0]==='crit'?'bad':''}"><b>Risk · ${a[1]}:</b> ${esc(a[2])}</div>`).join('')}
 <div class="grid g21" style="margin-top:12px"><div class="card"><h3>This month against target</h3><table class="t"><thead><tr><th>Parameter</th><th class="n">Target</th><th class="n">Actual</th><th class="n">Left</th><th>Achievement</th></tr></thead><tbody>${rows.map(r=>{const t=r[1][0],a=r[1][1];const pc=a/t*100;return `<tr><td>${r[0]}</td><td class="n">${r[2](t)}</td><td class="n">${r[2](a)}</td><td class="n">${a>=t?'—':r[2](t-a)}</td><td style="width:34%"><div class="row" style="flex-wrap:nowrap"><div style="flex:1">${bar(pc,pc>=100?'g':pc>=75?'':'w')}</div><b>${Math.round(pc)}%</b></div></td></tr>`}).join('')}</tbody></table><div class="grid g3" style="margin-top:10px">${kpi('Growth vs last month',(g>=0?'+':'')+g.toFixed(1)+'%','sales')}${kpi('Quarter to date',lk(p.tgt.sales[1]*qm*.92*1e5),'of '+lk(p.tgt.sales[0]*qm*1e5)+' target')}${kpi('Year to date',lk(p.tgt.sales[1]*ym*.85*1e5),'of '+lk(p.tgt.sales[0]*ym*1e5)+' target')}</div></div>
 <div class="card"><h3>Score evolution</h3>${s.score==null?'<p class="mini">Not enough data yet.</p>':lineChart(['Jun','Jul','Aug','Sep','Oct','Nov'],[{n:'Score',v:[...p.hist,s.score].slice(-6)}],{min:40,max:100,bands:[[60,'60'],[70,'70'],[80,'80'],[90,'90']],label:'Score evolution over six months'})}<p class="mini">History stays with the Partner ID after any promotion or territory change.</p></div></div>
 <div class="card" style="margin-top:12px"><h3>Score matrix (out of 100)</h3>${table(['Parameter','Weight','Score','Points','Status'],s.parts.map(x=>({c:[esc(x.n),x.w,x.v==null?'—':`<div class="row" style="flex-wrap:nowrap;min-width:120px"><div style="flex:1">${bar(x.v*100,x.v>=.8?'g':x.v>=.6?'':'w')}</div>${Math.round(x.v*100)}%</div>`,x.v==null?'—':(x.w*x.v).toFixed(1),x.v==null?'<span class="badge b-mute">Unverified – kept out of the score, not counted as zero</span>':x.v>=.8?'<span class="badge b-good">Strong</span>':x.v>=.6?'<span class="badge b-info">OK</span>':'<span class="badge b-ser">Weak</span>']})),{num:[1,3]})}<div class="mini" style="margin-top:6px">Score = points earned ÷ verified weight × 100. Bands: 90–100 Outstanding · 80–89 Excellent · 70–79 Good · 60–69 Needs Improvement · below 60 Underperforming.</div></div>
 <div class="grid g3" style="margin-top:12px"><div class="card"><h3>Strengths</h3>${strong.map(x=>`<div class="check"><span class="badge b-good">${Math.round(x.v*100)}%</span><div>${esc(x.n)}</div></div>`).join('')||'—'}</div><div class="card"><h3>Weaknesses</h3>${weak.filter(x=>x.v<.85).map(x=>`<div class="check"><span class="badge b-ser">${Math.round(x.v*100)}%</span><div>${esc(x.n)}</div></div>`).join('')||'<p class="mini">None below 85%</p>'}</div><div class="card"><h3>Improvement recommendations</h3>${[...weak.filter(x=>x.v<.85).map(x=>x.n),...s.un].slice(0,3).map(n=>`<div class="mini" style="margin-bottom:6px">• ${esc(IMPROVE[n]||'')}</div>`).join('')||'<p class="mini">Keep going.</p>'}</div></div>

function aiRecs(){const a=partner('ELP-DLR-0001'),pdA=promoDecision(a);const ru=partner('ELP-DLR-0005'),oR=overdue(ru.id);const ja=partner('ELP-DLR-0003');const ag=SKUS.find(x=>x.sku==='EL-AG-B250');const pendAG=DB.orders.filter(o=>['Pending Approval','Approved','Payment Confirmed','Processing'].includes(o.status)).reduce((x,o)=>x+o.items.filter(i=>i[0]==='EL-AG-B250').reduce((y,i)=>y+i[1],0),0);
 const sc=score(ja);const mp=GJ.gd.filter(d=>distInfo(d.n).vacant).sort((x,y)=>potential(y.n)-potential(x.n));
 return[
 {id:'R1',cat:'Promotion',title:'Assess Shree Krishna Traders (Anand) for Authorized Distributor',data:[`Weighted promotion score ${(pdA.e.weighted*100).toFixed(0)} vs ${pdA.c.promote*100} needed`,`${a.qtrs} quarters in a row at or above the promote score (needs ${pdA.c.q})`,`${a.outlets} active outlets; on-time payment 96%`,'Anand has no distributor yet (plan: one per district)'],why:'Meets every must-pass minimum and has the volume and payment record the Dealer→Distributor step asks for. Appointing a distributor in Anand opens the cluster for dealers.',risk:'Distributor stock-holding and working capital are not yet audited; margin slab rises by one point.',action:'Approve promotion assessment, then field-audit warehouse and working capital.',link:['partner','ELP-DLR-0001']},
 {id:'R2',cat:'Financial',title:'Start recovery on Rudra Traders and keep the suspension',data:[`${inr(oR.amt)} overdue, up to ${oR.days} days`,'Credit limit '+inr(ru.credit),'Score fell from 60 to 44 in five months','Order ORD-2611-0003 is on hold'],why:'Payments stopped, outlet count and collections dropped together. Further credit would add loss.',risk:'Brand presence in Gandhinagar lapses; a replacement dealer takes 4–6 weeks.',action:'Keep suspended, send formal demand, and open a replacement search in Gandhinagar.',link:['partner','ELP-DLR-0005']},
 {id:'R3',cat:'Territory',title:'Fast-track Mehsana and Patan applicants',data:[`${mp.slice(0,3).map(d=>d.n+' (potential '+potential(d.n)+')').join(', ')} are the highest-potential districts with no active partner`,'Mahadev Traders (Mehsana) is under verification; Shakti Enterprises (Patan) has just applied','Cluster 3 and 4 have no active partner today'],why:'Gaps sit inside planned clusters with industrial areas, so each new dealer also supports the cluster’s distributor case.',risk:'Both are unverified; one competing applicant per district today.',action:'Complete field verification this week and bring both to management review.',link:['go','apps']},
 {id:'R4',cat:'Inventory',title:'Schedule an Anti-Grease 250 ml batch',data:[`${ag.stock[0]} cartons available vs reorder level ${ag.reorder}`,`${pendAG} cartons already in the order pipeline`,'Latest Anti-Grease batch BATCH-2611-A03 is down to 260 cartons'],why:'Stock will hit zero before the next planned run if open orders convert.',risk:'Missed orders from industrial accounts, where reorders are most price-sensitive to delays.',action:'Ask production to plan a batch of about 600 cartons in the next 10 days.',link:['go','inv']},
 {id:'R5',cat:'Partner health',title:'Put Jay Ambe Stores (Valsad) on an improvement plan',data:[`Score ${sc.score} (${bandOf(sc.score)[0]}), falling for five months`,'Secondary sales not reported, so the score is based on fewer parameters','Two invoices unpaid beyond 30 days','48 of 100 target outlets active'],why:'The trend is steady decline rather than one bad month; the gap is in network and payment, not product demand.',risk:'If left, the agreement renewal in 2027 starts from a weak record.',action:'Field visit, monthly sales reporting, and a 90-day plan with milestones; no promotion or exclusivity until then.',link:['partner','ELP-DLR-0003']}]}
PAGES.ai=()=>{if(!can('ai'))return denied('AI Intelligence');const recs=aiRecs();DB.aiOpen=recs.filter(r=>!DB.decisions[r.id]).length;
 const act=DB.partners.filter(p=>p.status==='Active');const top=act.map(p=>({p,s:score(p).score})).filter(x=>x.s).sort((a,b)=>b.s-a.s)[0];const decl=act.filter(p=>trend(p)==='Declining'||trend(p)==='At risk'),inactive=act.filter(p=>trend(p)==='Inactive');
 const due30=DB.invoices.filter(i=>invOpen(i)>0&&i.due<=addDays(TODAY,30)&&i.due>=TODAY).reduce((a,i)=>a+invOpen(i),0);const paidRatio=DB.invoices.filter(i=>i.due<TODAY).reduce((a,i)=>a+i.paid,0)/Math.max(1,DB.invoices.filter(i=>i.due<TODAY).reduce((a,i)=>a+gross(i),0));
 const m=['2026-09','2026-10'].map(x=>DB.invoices.filter(i=>i.date.startsWith(x)).reduce((a,i)=>a+i.taxable,0));
 return `<h1>AI Intelligence</h1><p class="sub"><b>AI recommends. Management approves.</b> The assistant never approves promotions, exclusivity, credit limits, price changes, agreements, suspensions or terminations. Each recommendation shows its data, reasoning, risk and suggested action. (In this prototype the reasoning is rule-based; the real build uses the Claude API on the same data.)</p>
 <div class="grid g4" style="margin-bottom:12px">${kpi('Top performer',top?esc(top.p.name):'—',top?'score '+top.s:'')}${kpi('Declining or at risk',decl.length,decl.map(p=>p.name.split(' ')[0]).join(', '))}${kpi('Inactive',inactive.length,inactive.map(p=>p.name.split(' ')[0]).join(', ')||'none')}${kpi('Forecast collections, next 30 days',lk(due30*paidRatio),'open invoices due × '+Math.round(paidRatio*100)+'% historical pay rate')}</div>
 <p class="mini">Sales forecast: invoiced ${lk(m[0])} in Sep and ${lk(m[1])} in Oct, so a simple trend suggests about <b>${lk(m[1]*(m[1]/Math.max(1,m[0])))}</b> for Nov. Forecasts get sharper with more history.</p>
 <h2 style="margin:14px 0 8px">This month’s recommendations</h2><div class="grid">${recs.map(r=>{const d=DB.decisions[r.id];return `<div class="card"><div class="row"><span class="badge b-info">✦ ${r.cat}</span><b>${esc(r.title)}</b><div class="sp"></div>${d?`<span class="badge ${d.d==='Approved'?'b-good':d.d==='Rejected'?'b-crit':'b-warn'}">${d.d} by ${esc(d.by)}</span>`:'<span class="badge b-warn">Awaiting decision</span>'}</div>
 <div class="grid g2" style="margin-top:8px"><div><h3>Supporting data</h3><ul style="margin:4px 0;padding-left:18px">${r.data.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h3>Reasoning</h3><p style="margin:4px 0">${esc(r.why)}</p><h3>Risk</h3><p style="margin:4px 0">${esc(r.risk)}</p></div></div><div class="note ai"><b>Suggested action:</b> ${esc(r.action)}</div>
 <div class="row">${!d&&can('ai','approve')?`<button class="btn pri" data-a="airec" data-v="${r.id}|Approved">Approve action</button><button class="btn" data-a="airec" data-v="${r.id}|Deferred">Defer</button><button class="btn red" data-a="airec" data-v="${r.id}|Rejected">Reject</button>`:!d?'<span class="lock">🔒 Only authorised management can decide</span>':''}<button class="btn" data-a="${r.link[0]==='go'?'go':'openpartner'}" data-v="${r.link[1]}">Open related screen</button></div></div>`}).join('')}</div>`};
ACT.airec=(t)=>{const[id,d]=t.dataset.v.split('|');DB.decisions[id]={d,by:ROLES[S.role].u,t:TODAY};log('AI recommendation '+d.toLowerCase(),id,aiRecs().find(r=>r.id===id).title);if(id==='R1'&&d==='Approved'){render();ACT.promo({dataset:{v:'ELP-DLR-0001|approve'}});return}toast('Decision recorded. In the real build this also creates a follow-up task.');render()};

  out.push({id:'AI-RO-'+m.id,kind:'Reorder',title:`Order ${qty.toLocaleString('en-IN')} ${m.unit} of ${m.name}`,why:[`On hand ${m.onhand.toLocaleString('en-IN')} ${m.unit} lasts about ${cover(m)} days at ${m.perDay} ${m.unit}/day`,`Reorder level ${m.reorder}; already on the way: ${inc}`,vs?`${vs.name} (score ${vscore(vs)}) is the supplier${m.vAvail?' and has '+m.vAvail.toLocaleString('en-IN')+' '+m.unit+' available at ₹'+m.vRate:''}`:'No approved vendor for this item. Run an RFQ first',`Expected arrival ${days+DB.proc.leadBuffer} days after approval (lead ${days} + buffer ${DB.proc.leadBuffer})`],act:vs?['Create release order for approval','airo',m.id+'|'+qty]:['Ask vendors for a quote','go','vendors']})}});
 const dl={};DB.ros.filter(r=>r.status==='Received'&&r.actual).forEach(r=>{(dl[r.rm]=dl[r.rm]||[]).push(r.actual)});
 Object.entries(dl).forEach(([id,a])=>{const m=rmOf(id),avg=Math.ceil(a.reduce((x,y)=>x+y,0)/a.length);if(avg>m.lead+DB.proc.leadBuffer)out.push({id:'AI-LT-'+id,kind:'Lead time',title:`Raise the planned lead time for ${m.name} to ${avg-DB.proc.leadBuffer} days`,why:[`${vend(m.vendor).name} took ${avg} days on average against a plan of ${m.lead}+${DB.proc.leadBuffer}`,'A realistic lead time moves the reorder point earlier and avoids stock-outs'],act:['Update lead time','ailead',id+'|'+(avg-DB.proc.leadBuffer)]})});
 DB.partners.filter(p=>p.status==='Active').forEach(p=>{const n=LVL((p.crlvl||0)+1);if(!DB.ladderOK(p.crlvl||0))return;const s=score(p).score;const o=overdue(p.id);if(s!=null&&s>=n.min&&!o.amt&&!DB.creditReq.some(c=>c.eid===p.id&&c.status==='Pending'))out.push({id:'AI-CR-'+p.id,kind:'Credit',title:`Move ${p.name} to ${n.n}`,why:[`Score ${s} meets the ${n.min} needed for this step`,'No overdue invoices',`Opens ${inr(n.limit)} for ${n.days} days. Management approves`],act:['Send for approval','aicred','partner|'+p.id]})});
 DB.vendors.filter(v=>v.status==='Active').forEach(v=>{const cur=DB.vcredit[v.id]||0,n=LVL(cur+1);if(!DB.ladderOK(cur))return;const s=vscore(v);if(s!=null&&s>=n.min&&!DB.creditReq.some(c=>c.eid===v.id&&c.status==='Pending'))out.push({id:'AI-VC-'+v.id,kind:'Credit',title:`Let ${v.name} supply on credit: ${n.n}`,why:[`Vendor score ${s} meets the ${n.min} needed`,`EarthLabs could pay ${n.days} days after delivery up to ${inr(n.limit)}`],act:['Send for approval','aicred','vendor|'+v.id]})});
 const fg=SKUS.filter(s=>!s.draft&&!s.retired&&s.reorder&&s.stock[0]>s.reorder*1.6);const hid=SCHEMES.find(s=>!s.show&&!DB.schemeReq.some(r=>r.sch===s.id&&r.status==='Pending'));
 if(fg.length&&hid)out.push({id:'AI-SC-'+hid.id,kind:'Scheme',title:`Show “${hid.n}” to partners`,why:[`${fg[0].name} stock is ${fg[0].stock[0].toLocaleString('en-IN')} against a reorder level of ${fg[0].reorder}. A push scheme can move it`,'The scheme stays hidden until a Super Admin or designated user discloses it'],act:[canPub()?'Disclose now':'Request disclosure','aischeme',hid.id]});

ACT.schnew=()=>modal({title:'Add a scheme',body:`<div class="frm2">${field('Name',inp('n',''))}${field('Valid until',inp('u',addDays(TODAY,30),'date'))}</div>${field('What partners get',`<textarea name="d" rows="3"></textarea>`)}<div class="note">It starts hidden. Disclose it when you are ready. In the real build, each scheme’s pricing rule is configured here too.</div>`,actions:[{label:'Add',cls:'pri',fn:(b)=>{const d=formData(b);if(!d.n){toast('Give it a name');return false}SCHEMES.push({id:'SCH-0'+DB.counters.SCH++,n:d.n,d:d.d||'',type:'info',active:false,show:false,aud:'all'});log('Scheme added',d.n);toast('Added as hidden')}}]});
PAGES.pschemes=()=>{const p=CUR();const sc=SCHEMES.filter(s=>s.show&&s.active&&(s.aud==='all'||s.aud===p.cat));const lv=p.crlvl||0,n=LVL(lv+1),s=score(p).score;
 return `<h1>Offers &amp; credit</h1><p class="sub">Offers EarthLabs has opened for you, and how your credit grows with performance.</p>
 <div class="grid g21" style="align-items:start"><div>${sc.length?sc.map(x=>`<div class="card" style="margin-bottom:10px"><div class="row"><span class="badge b-gold">Offer</span><b>${esc(x.n)}</b></div><p>${esc(x.d)}</p><button class="btn pri sm" data-a="go" data-v="porder">Use it on an order</button></div>`).join(''):'<div class="card"><p class="mini">No offers are open for you right now. EarthLabs opens offers from time to time.</p></div>'}</div>
 <div class="card"><h3>Your credit</h3><div class="kpi" style="margin:8px 0"><div class="l">Current level</div><div class="v">${LVL(lv).n}</div><div class="d">${lv?inr(LVL(lv).limit)+' for '+LVL(lv).days+' days':'Pay before dispatch'}</div></div>
 ${DB.ladderOK(lv)?`<p class="mini">Next: <b>${n.n}</b>, needs a score of ${n.min}+ and no overdue payments. Your score is ${s==null?'—':s}.</p>${bar(Math.min(100,(s||0)/n.min*100),'g')}`:'<p class="mini">You are at the top level.</p>'}<p class="mini" style="margin-top:8px">EarthLabs reviews credit every month. Management approves each step.</p></div></div>`};
/* ---------- procurement page ---------- */
const procTabs=[['inv','Raw-material inventory'],['vsr','Vendor stock reports'],['ro','Release orders'],['plan','Production & batch link'],['credit','Credit ladder'],['rules','Rules & lead times'],['ai','AI assistant']];
PAGES.proc=()=>{if(!can('proc'))return denied('Procurement & Raw Materials');const tab=curTab('pr','inv'),E=can('proc','edit'),C=can('proc','create');
 const low=DB.rm.filter(m=>rmState(m)[1]!=='b-good').length,open=DB.ros.filter(r=>OPEN_RO.includes(r.status)),wait=DB.vsr.filter(r=>r.status==='Pending approval').length;
 let body='';
 if(tab==='inv')body=`<div class="grid g4">${kpi('Items needing attention',low,'below reorder or at stock-out risk')}${kpi('Release orders open',open.length,'approved, not yet received')}${kpi('Value on the way',inr(open.reduce((a,r)=>a+roTot(r),0)),'ex-GST')}${kpi('Vendor reports to approve',wait,'in Approvals')}</div>
 <h3 style="margin:16px 0 8px">What is available</h3>${table(['Item','Vendor','EarthLabs stock','On the way','Vendor-held (reported)','Reorder at','Cover','Lead (days)','Status',''],DB.rm.map(m=>{const s=rmState(m);return{c:[`<div style="min-width:170px"><b>${esc(m.name)}</b><div class="mini">${m.id}</div></div>`,m.vendor?`<div style="min-width:120px">${esc(vend(m.vendor).name)}</div>`:'<span class="badge b-warn">None</span>',m.onhand.toLocaleString('en-IN')+' '+m.unit,incoming(m.id)?incoming(m.id).toLocaleString('en-IN'):'—',m.vAvail?`<b>${m.vAvail.toLocaleString('en-IN')}</b> ${m.unit}<div class="mini">${m.vDate}, ₹${m.vRate}, ${m.vLead} d</div>`:'<span class="mini">no report</span>',m.reorder,cover(m)+' days',E?`<input type="number" min="0" value="${m.lead}" style="width:62px;border:1px solid var(--line);border-radius:8px;padding:4px 6px" data-c="rmlead" data-v="${m.id}" aria-label="Lead time for ${esc(m.name)}">`:m.lead,`<span class="badge ${s[1]}">${s[0]}</span>`,C&&m.vendor?`<button class="btn sm" data-a="ronew" data-v="${m.id}">Order</button>`:'']}}),{num:[2,3,5]})}
 <div class="card flat" style="margin-top:12px"><h3>Finished goods (from batches)</h3><div class="row">${SKUS.filter(s=>!s.draft&&!s.retired).map(s=>`<span class="badge b-info">${esc(s.name.replace('Herbal Hand Wash · ','').replace('Anti-Grease Hand Wash · ','Anti-Grease '))}: ${s.stock[0]+s.stock[1]}</span>`).join('')}<button class="btn sm" data-a="go" data-v="inv">Open Inventory &amp; Dispatch</button></div></div>`;
 if(tab==='vsr')body=`<p class="sub">Vendors report what they hold available. Once you approve a report, it updates the figures above and the vendor’s quoted lead time.</p>${table(['Report','Vendor','Date','Items','Status',''],DB.vsr.slice().reverse().map(r=>({c:[r.id,esc(vend(r.vid).name),r.date,r.lines.map(l=>esc(l.rm?rmOf(l.rm).name:l.name)).join(', '),stBadge(r.status),`<button class="btn sm" data-a="vsrview" data-v="${r.id}">View</button> ${r.status==='Pending approval'&&isSuper()?`<button class="btn sm pri" data-a="vsrapprove" data-v="${r.id}">Approve</button>`:''}`]})))}`;
 if(tab==='ro')body=`<div class="row"><p class="sub" style="margin:0">Raise, approve, email, pay and receive. Pay and carry: the vendor dispatches after payment.</p><div class="sp"></div>${C?`<button class="btn pri" data-a="ronew">New release order</button>`:''}</div>${table(['Order','Item','Vendor','Value','Deliver by','Status','Payment',''],DB.ros.map(r=>{const m=rmOf(r.rm);return{c:[`<b>${r.id}</b>`,esc(m.name)+'<div class="mini">'+r.qty.toLocaleString('en-IN')+' '+m.unit+'</div>',esc(vend(r.vid).name),inr(roTot(r)),r.eta||'—',stBadge(r.status),r.pay.status==='Paid'?'<span class="badge b-good">Paid</span>':r.pay.status==='On credit'?`<span class="badge b-info">Credit ${r.pay.days} d</span>`:r.status==='Pending approval'?'—':'<span class="badge b-warn">Unpaid</span>',`<button class="btn sm" data-a="roview" data-v="${r.id}">View</button> ${r.status==='Pending approval'&&isSuper()?`<button class="btn sm pri" data-a="roapprove" data-v="${r.id}">Approve</button>`:''}${['Approved','Acknowledged','Dispatched'].includes(r.status)&&r.pay.status==='Unpaid'&&can('proc','verify')?` <button class="btn sm gold" data-a="ropay" data-v="${r.id}">Pay</button>`:''}${r.status==='Dispatched'&&can('proc','verify')?` <button class="btn sm pri" data-a="roreceive" data-v="${r.id}">Receive</button>`:''}`]}}),{num:[3]})}`;
 if(tab==='plan')body=planView(C);
 if(tab==='credit')body=creditView();
 if(tab==='rules')body=rulesView(E);
 if(tab==='ai')body=aiView();
 return `<h1>Procurement &amp; raw materials</h1><p class="sub">Vendor stock, raw-material inventory, release orders and credit. Everything adjustable by management. Linked to the Batch Management System.</p>${tabs('pr',procTabs,'inv')}${body}`};
ACT.rmlead=(t)=>{const m=rmOf(t.dataset.v);const o=m.lead;m.lead=Math.max(0,+t.value||0);log('Lead time changed',m.id,m.name+' '+o+' → '+m.lead+' days');toast('Lead time updated');render()};
ACT.ronew=(t)=>{const pre=t.dataset.v?rmOf(t.dataset.v):null;const ro=DB.rm.filter(m=>m.vendor);modal({title:'New release order',body:`<div class="frm2">${field('Item',sel('rm',ro.map(m=>[m.id,m.name]),pre?pre.id:''))}${field('Quantity',inp('q',pre?Math.max(0,pre.reorder*2-pre.onhand-incoming(pre.id)):'','number'))}</div><div class="note">Vendor, rate and lead time come from the item and the vendor’s approved stock report. You can change them in Rules &amp; lead times.</div>`,actions:[{label:'Send for approval',cls:'pri',fn:(b)=>{const d=formData(b);if(!(+d.q>0)){toast('Enter a quantity');return false}const r=roDraft(rmOf(d.rm),d.q,ROLES[S.role].u);toast(r.status==='Approved'?'Auto-approved and emailed':'Sent to Super Admin for approval')}}]})};
ACT.ropay=(t)=>{const r=roOf(t.dataset.v);modal({title:'Pay vendor · '+r.id,body:`<p>${esc(vend(r.vid).name)} · ${inr(roTot(r))} ex-GST. Pay and carry needs ${DB.proc.advancePct}% before dispatch.</p><div class="frm2">${field('Amount (₹)',inp('a',r.pay.amt||Math.round(roTot(r)*DB.proc.advancePct/100),'number'))}${field('Mode',sel('m',['NEFT','RTGS','UPI']))}${field('Reference (UTR)',inp('ref',''))}</div>`,actions:[{label:'Record payment',cls:'pri',fn:(b)=>{const d=formData(b);if(!(+d.a>0)){toast('Enter the amount');return false}r.pay={mode:'Advance',status:'Paid',amt:+d.a,ref:d.ref||'—'};r.hist.push([TODAY,'Payment released '+inr(+d.a)]);sentNotice('Payment released to vendor',vend(r.vid).name,r.id);log('Vendor payment',r.id,inr(+d.a));toast('Recorded. Vendor can dispatch')}}]})};
ACT.roreceive=(t)=>{const r=roOf(t.dataset.v),m=rmOf(r.rm);modal({title:'Receive · '+r.id,body:`${field('Quantity received ('+m.unit+')',inp('q',r.qty,'number'))}<div class="note">Adds to raw-material stock and records the real days taken. The AI uses this to improve lead times.</div>`,actions:[{label:'Add to stock',cls:'pri',fn:(b)=>{const d=formData(b);m.onhand+=+d.q;r.status='Received';r.rcv=TODAY;r.actual=daysBetween(r.appr,TODAY);r.hist.push([TODAY,'Received '+d.q+' '+m.unit+' ('+r.actual+' days)']);log('Goods received',r.id,d.q+' '+m.unit);toast('Stock updated')}}]})};
/* production planner + batch link */
function planView(C){const sk=SKUS.filter(s=>DB.bom[s.sku]);const pl=S.plan||{sku:sk[1].sku,c:200};const bom=DB.bom[pl.sku];const need=Object.entries(bom).map(([id,per])=>{const m=rmOf(id),req=per*pl.c,short=Math.max(0,req-m.onhand-incoming(id));return{m,req,short}});
 return `<div class="note ai">The Batch Management System (Supabase) records each batch. Here its production plan turns into raw-material needs, and its consumption keeps this inventory true. <span class="badge b-good">Connected (demo)</span></div>
 <div class="grid g2"><div class="card"><h3>Production planner</h3><div class="frm2" style="margin-top:8px">${field('Product',sel('sku',sk.map(s=>[s.sku,s.name]),pl.sku).replace('<select','<select data-c="planset" data-v="sku"'))}${field('Cartons to make',inp('c',pl.c,'number').replace('<input','<input data-c="planset" data-v="c"'))}</div>${table(['Raw material','Needed','In stock','Short'],need.map(n=>({c:[esc(n.m.name),Math.round(n.req*10)/10+' '+n.m.unit,n.m.onhand.toLocaleString('en-IN'),n.short?`<b style="color:var(--crit)">${Math.round(n.short)}</b>`:'—']})),{num:[1,2,3]})}${need.some(n=>n.short&&n.m.vendor)&&C?`<div class="row" style="margin-top:8px"><button class="btn pri" data-a="plancreate">Raise release orders for the shortfall</button></div>`:''}</div>
 <div class="card"><h3>Consumption by batch</h3>${table(['Batch','Product','Made','Raw material'],DB.batches.map(b=>({c:[b.code,esc((sku(b.sku)||{}).cat||b.sku),b.qty,b.rmDone?'<span class="badge b-good">Recorded</span>':can('proc','edit')?`<button class="btn sm" data-a="batchrec" data-v="${b.code}">Record</button>`:'Pending']})),{num:[2]})}<p class="mini" style="margin-top:6px">Recording deducts the bill of materials from stock.</p></div></div>`}
ACT.planset=(t)=>{S.plan=S.plan||{sku:'EL-HW-B250',c:200};S.plan[t.dataset.v]=t.dataset.v==='c'?+t.value:t.value;render()};
ACT.plancreate=()=>{const pl=S.plan||{sku:'EL-HW-B250',c:200};let n=0;Object.entries(DB.bom[pl.sku]).forEach(([id,per])=>{const m=rmOf(id),sh=per*pl.c-m.onhand-incoming(id);if(sh>0&&m.vendor){roDraft(m,Math.ceil(sh),ROLES[S.role].u);n++}});toast(n+' release order(s) sent for approval');render()};
ACT.batchrec=(t)=>{const b=DB.batches.find(x=>x.code===t.dataset.v);const bom=DB.bom[b.sku];if(!bom){toast('No bill of materials for this product');return}Object.entries(bom).forEach(([id,per])=>{const m=rmOf(id),q=Math.round(per*b.qty*10)/10;m.onhand=Math.max(0,m.onhand-q);DB.rmUse.push({t:TODAY,batch:b.code,rm:id,q})});b.rmDone=true;log('Batch consumption recorded',b.code,'raw material deducted');toast('Raw material deducted and synced');render()};
/* credit */
function creditView(){const M=isSuper();const L=DB.proc.ladder;
 return `<div class="note">Initial model: <b>pay and carry</b>. No credit is given to a new partner or vendor. As the performance score proves itself, management raises credit step by step. The AI proposes, you approve.</div>
 <div class="grid g4">${L.map((l,i)=>`<div class="kpi"><div class="l">Level ${i}</div><div class="v" style="font-size:19px">${l.n}</div><div class="d">${l.limit?inr(l.limit)+' · '+l.days+' days':'No credit'}<br>${l.min?'Score '+l.min+'+':'Default'}</div></div>`).join('')}</div>
 <h3 style="margin:16px 0 8px">Partners (EarthLabs sells)</h3>${table(['Partner','Score','Level','Limit','Next level',''],DB.partners.filter(p=>p.status==='Active').map(p=>{const s=score(p).score,n=LVL((p.crlvl||0)+1),ok=DB.ladderOK(p.crlvl||0)&&s!=null&&s>=n.min&&!overdue(p.id).amt;return{c:[`<b>${esc(p.name)}</b>`,s==null?'—':s,LVL(p.crlvl||0).n,inr(p.credit),DB.ladderOK(p.crlvl||0)?(ok?'<span class="badge b-good">Eligible: '+n.n+'</span>':'<span class="badge b-mute">Needs '+n.min+'+ and no overdue</span>'):'Top',M?`<button class="btn sm" data-a="crset" data-v="partner|${p.id}">Set level</button>`:'']}}),{num:[1,3]})}
 <h3 style="margin:16px 0 8px">Vendors (EarthLabs buys)</h3>${table(['Vendor','Score','Level','Credit EarthLabs gets','',''],DB.vendors.filter(v=>v.status==='Active').map(v=>{const c=DB.vcredit[v.id]||0,s=vscore(v);return{c:[`<b>${esc(v.name)}</b>`,s,LVL(c).n,c?inr(LVL(c).limit)+' · '+LVL(c).days+' days':'Pay before dispatch','',M?`<button class="btn sm" data-a="crset" data-v="vendor|${v.id}">Set level</button>`:'']}}),{num:[1]})}
 <p class="mini" style="margin-top:8px">Invoices raised before pay and carry keep their original terms.</p>`}
ACT.crset=(t)=>{const[k,id]=t.dataset.v.split('|');const nm=k==='partner'?partner(id).name:vend(id).name;const cur=k==='partner'?(partner(id).crlvl||0):(DB.vcredit[id]||0);modal({title:'Credit level · '+esc(nm),body:field('Level',sel('l',DB.proc.ladder.map((l,i)=>[i,'Level '+i+' · '+l.n+(l.limit?' · '+inr(l.limit):'')]),cur))+'<div class="note">Takes effect at once and is logged. Super Admin only.</div>',actions:[{label:'Apply',cls:'pri',fn:(b)=>{applyCredit(k,id,+formData(b).l);toast('Credit level changed')}}]})};
/* rules */
function rulesView(E){const P=DB.proc,dis=E?'':'disabled';const num=(k,l,u)=>field(l,`<input type="number" min="0" value="${P[k]}" data-c="procset" data-v="${k}" ${dis}>`+(u?`<small>${u}</small>`:''));
 return `<div class="note ai">Everything on this screen is a setting, not code. Change it and the whole system follows.${E?'':' Only Super Admin and the warehouse lead can edit.'}</div>
 <div class="grid g2"><div class="card"><h3>Lead time and approval</h3><div class="frm2" style="margin-top:8px">${num('leadBuffer','Safety buffer (days)','Added to every vendor lead time')}${num('roLimit','Flag release orders above (₹)','Shown as “Above approval limit”')}${num('autoLimit','Auto-approve up to (₹)','0 means every order needs approval')}${num('advancePct','Advance before dispatch (%)','100 means full pay and carry')}</div><label class="row" style="gap:6px"><input type="checkbox" data-c="procauto" ${P.autoEmail?'checked':''} ${dis}> Email the vendor automatically when a release order is approved</label><p class="mini">Item lead times are edited in Raw-material inventory.</p></div>
 <div class="card"><h3>Who can disclose schemes</h3><p class="mini">Super Admin always can. Add the expert you trust.</p>${['sales','accounts','warehouse'].map(r=>`<label class="row" style="gap:6px"><input type="checkbox" data-c="pubrole" data-v="${r}" ${P.pubRoles.includes(r)?'checked':''} ${isSuper()?'':'disabled'}> ${ROLES[r].n}</label>`).join('')}</div></div>
 <div class="card" style="margin-top:12px"><h3>Credit ladder</h3>${table(['Level','Name','Limit (₹)','Days','Minimum score'],P.ladder.map((l,i)=>({c:[i,esc(l.n),`<input type="number" min="0" value="${l.limit}" data-c="ladset" data-v="${i}|limit" ${i&&isSuper()?'':'disabled'} style="width:110px">`,`<input type="number" min="0" value="${l.days}" data-c="ladset" data-v="${i}|days" ${i&&isSuper()?'':'disabled'} style="width:70px">`,`<input type="number" min="0" max="100" value="${l.min}" data-c="ladset" data-v="${i}|min" ${i&&isSuper()?'':'disabled'} style="width:70px">`]})))}</div>`}
ACT.procset=(t)=>{const k=t.dataset.v,o=DB.proc[k];DB.proc[k]=Math.max(0,+t.value||0);log('Procurement rule changed',k,o+' → '+DB.proc[k]);toast('Saved');render()};
ACT.procauto=(t)=>{DB.proc.autoEmail=t.checked;log('Procurement rule changed','autoEmail',String(t.checked));toast('Saved')};
ACT.pubrole=(t)=>{const r=t.dataset.v,l=DB.proc.pubRoles;DB.proc.pubRoles=t.checked?[...new Set([...l,r])]:l.filter(x=>x!==r);log('Scheme publisher '+(t.checked?'added':'removed'),r);toast('Saved');render()};
ACT.ladset=(t)=>{const[i,k]=t.dataset.v.split('|');DB.proc.ladder[+i][k]=Math.max(0,+t.value||0);log('Credit ladder changed','Level '+i,k+' = '+t.value);toast('Saved')};
/* AI */
const AIQ=[['What should we reorder this week?','Reorder'],['Which vendors are a delay risk?','delay'],['Who has earned credit?','Credit'],['Which scheme should we show?','Scheme'],['How does pay and carry work?','explain']];
function aiAnswer(q){const recs=procAI();const f=k=>recs.filter(r=>r.kind===k);
 if(q==='delay'){const late=DB.ros.filter(r=>OPEN_RO.includes(r.status)&&r.eta&&r.eta<=TODAY).map(r=>`${r.id} (${vend(r.vid).name}) was due ${r.eta}`);const slow=f('Lead time').map(r=>r.title);return (late.length?'Overdue: '+late.join('; ')+'. ':'')+(slow.length?'History says: '+slow.join('; ')+'. ':'')+(!late.length&&!slow.length?'No vendor looks late today.':'')}
 if(q==='explain')return `Pay and carry means no credit at the start. A partner pays before EarthLabs dispatches, and EarthLabs pays a vendor ${DB.proc.advancePct}% before the vendor dispatches. After enough verified performance, management moves a partner or vendor up the credit ladder (${DB.proc.ladder.slice(1).map(l=>l.n+' '+inr(l.limit)).join(', ')}). I only propose; you approve each step in Approvals.`;
 const r=f(q);return r.length?r.map(x=>x.title+'. '+x.why[0]+'.').join(' '):'Nothing to suggest right now.'}
function aiView(){const recs=procAI();const a=S.aiq?aiAnswer(S.aiq):'';
 return `<div class="note ai"><b>✦ AI assistant.</b> It reads stock, lead times, vendor and partner scores, then proposes. <b>AI recommends, management approves.</b> In this demo it is rule-based. The real build uses the Claude API on the same data.</div>
 <div class="card"><h3>Ask</h3><div class="row" style="margin-top:8px">${AIQ.map(q=>`<button class="btn sm" aria-pressed="${S.aiq===q[1]}" data-a="aiq" data-v="${q[1]}">${q[0]}</button>`).join('')}</div>${a?`<div class="note ai" style="margin-top:10px">${esc(a)}</div>`:''}</div>
 <h3 style="margin:16px 0 8px">Recommendations (${recs.length})</h3>${recs.length?recs.map(r=>`<div class="card" style="margin-bottom:10px"><div class="row"><span class="badge b-info">${r.kind}</span><b>${esc(r.title)}</b></div><ul class="pts" style="margin:8px 0">${r.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul><div class="row"><button class="btn pri sm" data-a="${r.act[1]}" data-v="${r.act[2]}">${r.act[0]}</button><button class="btn sm" data-a="aidismiss" data-v="${r.id}">Dismiss</button></div></div>`).join(''):'<div class="note ok">All clear.</div>'}`}
ACT.aiq=(t)=>{S.aiq=S.aiq===t.dataset.v?null:t.dataset.v;render()};
ACT.aidismiss=(t)=>{DB.procDec[t.dataset.v]='dismissed';render()};
ACT.airo=(t)=>{const[id,q]=t.dataset.v.split('|');const r=roDraft(rmOf(id),q,'AI assistant');DB.procDec['AI-RO-'+id]='done';toast('Release order '+r.id+' sent for approval');render()};

const pm=n=>(Math.round(n*10)/10)+"%";
const TIERS=['DLR','DST','STK','MST','SST','INS'];
function marginFor(cat,s){const k=cat;if(s.m&&s.m[k]!=null)return s.m[k];if(k==='INS')return .10;const sl=SLAB[k]||SLAB.DLR;return sl[s.slab]}

function tierPrices(s){const exg=s.mrp/(1+GST);const o={base:exg};TIERS.forEach(k=>o[k]=exg*(1-marginFor(k,s)));return o}
function skuMatrix(E){
 const rows=SKUS.map(s=>{const t=tierPrices(s);const ms=TIERS.map(k=>marginFor(k,s));const bad=ms.slice(0,5).some((m,i,a)=>i&&m<a[i-1]-1e-9);
  return{c:[`<b>${esc(s.name)}</b><div class="mini">${s.sku} · ${s.pack} ${s.unit.split(' / ')[0]} per carton${s.ph?' · <span class="badge b-warn">placeholder</span>':''}${s.draft?' · <span class="badge b-mute">draft</span>':''}${s.m?' · <span class="badge b-gold">custom margins</span>':''}</div>${bad?'<div class="mini" style="color:var(--crit)">⚠ A higher step has a lower margin</div>':''}`,
   E?`<input type="number" min="0" step="0.5" value="${s.mrp}" style="width:78px;border:1px solid var(--line);border-radius:8px;padding:5px 7px" data-c="skumrp" data-v="${s.sku}" aria-label="MRP of ${esc(s.name)}">`:'₹'+s.mrp.toFixed(2),'₹'+t.base.toFixed(2),
   ...TIERS.map((k,i)=>`<div style="min-width:96px"><div style="white-space:nowrap">${E?`<input type="number" min="0" max="40" step="0.5" value="${Math.round(ms[i]*1000)/10}" style="width:62px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;${s.m&&s.m[k]!=null?'background:#fbf1da':''}" data-c="skum" data-v="${s.sku}|${k}" aria-label="${CATS[k].n} margin for ${esc(s.name)}"> %</div>`:'<b>'+pm(ms[i]*100)+'</b>'}<div class="mini">₹${t[k].toFixed(2)}<br>earns ₹${(t.base-t[k]).toFixed(2)}</div></div>`),
   E&&s.m?`<button class="btn sm" data-a="skumreset" data-v="${s.sku}">Reset to slab</button>`:'']}});
 return `<p class="sub">One place for every SKU’s MRP and the margin each partner step earns on it. Price to the partner = MRP ÷ 1.18 × (1 − margin). A shaded box is a SKU-specific margin; the rest follow the default slab. Changes apply to new orders and are logged.</p>${table(['Product','MRP incl. GST (₹)','Base ex-GST',...TIERS.map(k=>CATS[k].s||k),''],rows,{num:[1,2]})}<p class="mini" style="margin-top:8px">“Earns” is the partner’s margin per unit before GST. Default slabs are on the next tabs. Institutional buyers default to 10%.</p>`}

  const cart=el.reduce((a,l)=>a+l.cartons,0),val=el.reduce((a,l)=>a+l.amt,0);if(cart<(s.minCartons||0)||val*(1+GST)<(s.minValue||0))return;
